name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: pip install -e . pytest ruff mypy
      - name: pytest
        run: pytest tests/ -x -q
      - name: ruff
        run: ruff check sentry/
      - name: mypy
        run: mypy sentry/ --ignore-missing-imports
