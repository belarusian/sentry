[project]
name = "sentry"
version = "0.2.0"
description = "A deterministic, stdlib-only Python supervisor for pipeline rescue."
requires-python = ">=3.10"

[project.scripts]
sentry = "sentry.cli:main"

[tool.setuptools]
packages = ["sentry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
